name: FUB Google Sheets Sync

# Two triggers:
#  1. schedule  -> fires every hour (UTC). GitHub cron is UTC and Eastern shifts
#     with daylight saving, so rather than do cron math we fire hourly and let
#     the script (maybe_gate_eastern_hour) proceed only when the wall-clock
#     Eastern hour is 7am-10pm. Runs outside that window are ~5s no-ops. Each
#     run refreshes today's running totals and re-finalizes yesterday; the 10pm
#     run is the day's final pass. This is DST-proof.
#  2. workflow_dispatch -> manual run from the Actions tab, with a mode input so
#     the operator can trigger the one-time backfill without a terminal.
on:
  schedule:
    - cron: "0 * * * *"   # hourly; the script gates to 7am-10pm Eastern
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
      days:
        description: "Backfill window in days (backfill mode only)"
        required: false
        default: "30"
        type: string

concurrency:
  # Never let two syncs write the sheet at once.
  group: fub-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sheets_sync/requirements.txt

      - name: Install dependencies
        run: pip install -r sheets_sync/requirements.txt

      - name: Run sync
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Exposes the trigger to the script so the Eastern-hour gate only
          # applies to scheduled runs (manual dispatch always proceeds).
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          DAYS="${{ github.event.inputs.days }}"
          # Scheduled runs have no inputs -> default to daily.
          MODE="${MODE:-daily}"
          DAYS="${DAYS:-30}"
          echo "Running mode=$MODE days=$DAYS event=${{ github.event_name }}"
          python sheets_sync/fub_sheets_sync.py --mode "$MODE" --days "$DAYS"
