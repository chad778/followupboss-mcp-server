name: FUB Daily Activity Audit

# Fires hourly (UTC), same DST-proof pattern as fub-sheets-sync.yml: the
# script (maybe_gate_eastern_hour) only proceeds when the wall-clock Eastern
# hour is 8pm. Runs outside that hour are ~5s no-ops.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Audit a specific date (YYYY-MM-DD) instead of yesterday"
        required: false
        default: ""
        type: string

concurrency:
  group: fub-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sheets_sync/requirements.txt

      - name: Install dependencies
        run: pip install -r sheets_sync/requirements.txt

      - name: Run daily audit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          # Exposes the trigger to the script so the 8pm-Eastern gate only
          # applies to scheduled runs (manual dispatch always proceeds).
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python sheets_sync/daily_audit.py --date "$DATE" --force
          else
            python sheets_sync/daily_audit.py
          fi
