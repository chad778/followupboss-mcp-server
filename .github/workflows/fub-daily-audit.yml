name: FUB Daily Activity Audit

# Reports on YESTERDAY's per-agent activity (a fully completed business day)
# every evening. Fires at two UTC times to bracket 8pm Eastern across DST --
# the script gates on the wall-clock Eastern hour (== 20), so whichever
# trigger actually lands at 8pm ET sends the report and the other is a no-op.
# Same DST-proof approach as fub-sheets-sync.yml.
on:
  schedule:
    - cron: "0 0 * * *"   # 8pm EDT (UTC-4)
    - cron: "0 1 * * *"   # 8pm EST (UTC-5)
  workflow_dispatch: {}

concurrency:
  group: fub-daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sheets_sync/requirements.txt

      - name: Install dependencies
        run: pip install -r sheets_sync/requirements.txt

      - name: Run daily audit
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FUB_CHAT_WEBHOOK_URL: ${{ secrets.FUB_CHAT_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG="--force"
          fi
          python sheets_sync/fub_daily_audit.py $FORCE_FLAG
